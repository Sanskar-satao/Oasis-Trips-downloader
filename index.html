<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest AI - Download</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Body and Background */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            background: url(https://wallpaperbat.com/img/77770488-brave-browser-wallpaper.jpg) no-repeat center center fixed;
            background-size: cover;
        }

        /* Glassmorphic Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px;
            width: 400px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: #fff;
        }

        .glass-card h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .glass-card p {
            font-size: 16px;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        /* Download Button */
        .download-btn {
            display: inline-block;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 450px) {
            .glass-card {
                width: 90%;
                padding: 30px;
            }

            .glass-card h1 {
                font-size: 28px;
            }

            .download-btn {
                padding: 12px 25px;
                font-size: 16px;
            }
        }

        .app-logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            border-radius: 20px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <h1>Quest AI</h1>
        <p>AI for Students — Smart, Free, Simple</p>
        <a class="download-btn" href="https://github.com/Sanskar-satao/Quest-AI/releases/download/v1.0.0/Quest.AI.zip"
            download>Download For Windows For Free</a>
    </div>

    <footer>
        &copy; 2025 Quest AI. All rights reserved.
    </footer>

</body>

</html>
